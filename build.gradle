plugins {
    // Android Gradle Plugin 8.3.0 comes from buildSrc/build.gradle; that version
    // also opens in on-device IDEs such as AndroidIDE
    id 'com.android.application' apply false
    id 'com.android.library' apply false
}

ext {
    compileSdk = 34
    // Android 10
    minSdk = 29
    // Stays 28: AIDE runs aapt, aidl and other tools it extracts into its
    // data directory, which targetSdk 29+ forbids (W^X)
    targetSdk = 28
}
