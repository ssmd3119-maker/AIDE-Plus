// Desktop (Android Gradle Plugin) build for AIDE-Plus.
// The build.gradle files next to the sources are read by AIDE itself on the
// device and are left untouched; this build only points at the same sources.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // ColorPickerPreference is only published here
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

rootProject.name = 'AIDE-Plus'

include ':appAideBase', ':app_rewrite', ':app_flavor'
