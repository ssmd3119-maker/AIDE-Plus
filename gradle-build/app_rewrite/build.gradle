plugins {
    id 'com.android.library'
}

def moduleDir = new File(rootProject.srcRoot, 'app_rewrite')

def fixedApiJars = tasks.register('fixApiJars', FixInnerClassesTask) {
    jars.from(new File(rootProject.srcRoot, 'appAideBase/provider/AIDE+底包-2.2-api.jar'))
    jars.from(fileTree(dir: new File(moduleDir, 'provider'), include: ['*.jar']))
    // boolean MainActivity.checkSelfPermission(String) clashes with Context's int version
    removedMethods.add('com/aide/ui/MainActivity.checkSelfPermission(Ljava/lang/String;)Z')
    outputDir = layout.buildDirectory.dir('fixed-api-jars')
}

// AGP 8 rejects the package attribute in library manifests, use a copy without it
def manifestCopy = layout.buildDirectory.file('manifest/AndroidManifest.xml').get().asFile
manifestCopy.parentFile.mkdirs()
manifestCopy.text = new File(moduleDir, 'src/main/AndroidManifest.xml').getText('UTF-8')
        .replaceFirst(/\s+package="[^"]*"/, '')

android {
    namespace 'com.aide.ui.rewrite'
    compileSdk rootProject.compileSdk

    defaultConfig {
        minSdk rootProject.minSdk
    }

    sourceSets {
        main {
            manifest.srcFile manifestCopy
            java.srcDirs = [new File(moduleDir, 'src/main/java')]
            res.srcDirs = [new File(moduleDir, 'src/main/res')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api project(':appAideBase')

    // Plain class jars
    implementation files(
            new File(moduleDir, 'libs/apksig-8.5.0-alpha07.jar'),
            new File(moduleDir, 'libs/bcprov-jdk15on-1.70.jar'),
            new File(moduleDir, 'libs/maven-model-3.9.1.jar'),
            new File(moduleDir, 'libs/plexus-utils-3.5.1.jar'),
            new File(moduleDir, 'libs/MTDataFilesProvider.jar'))

    // Compile-time only; the jars that hold dex are added to the apk by :app_flavor
    compileOnly fileTree(fixedApiJars.flatMap { it.outputDir }) { builtBy fixedApiJars }
    compileOnly 'io.github.itsaky:nb-javac-android:17.0.0.3'

    api 'androidx.core:core:1.13.0'
    api 'androidx.preference:preference:1.2.1'
    api 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0'
    api 'net.margaritov.preference.colorpicker.ColorPickerPreference:ColorPickerPreference:1.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
