plugins {
    id 'com.android.library'
}

def fixedApiJars = tasks.register('fixApiJars', FixInnerClassesTask) {
    jars.from(file('provider/AIDE+底包-2.2-api.jar'))
    // boolean MainActivity.checkSelfPermission(String) clashes with Context's int version
    removedMethods.add('com/aide/ui/MainActivity.checkSelfPermission(Ljava/lang/String;)Z')
    outputDir = layout.buildDirectory.dir('fixed-api-jars')
}

android {
    namespace 'com.aide.ui.base'
    compileSdk rootProject.compileSdk

    defaultConfig {
        minSdk rootProject.minSdk
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api 'dev.rikka.shizuku:provider:13.1.5'
    api 'dev.rikka.shizuku:api:13.1.5'
    api 'androidx.browser:browser:1.8.0'
    api 'androidx.drawerlayout:drawerlayout:1.2.0'
    // ActionBarDrawerToggle; the rest of legacy-support-v4 is unused
    api 'androidx.legacy:legacy-support-core-ui:1.0.0'
    api 'androidx.annotation:annotation:1.9.1'

    // Prebuilt AIDE classes (stub api); the dex itself is added to the apk by :app_flavor
    compileOnly fileTree(fixedApiJars.flatMap { it.outputDir }) { builtBy fixedApiJars }
}
