plugins {
    id 'com.android.library'
}

def fixedApiJars = tasks.register('fixApiJars', FixInnerClassesTask) {
    jars.from(rootProject.file('appAideBase/provider/AIDE+底包-2.2-api.jar'))
    jars.from(fileTree(dir: 'provider', include: ['*.jar']))
    // boolean MainActivity.checkSelfPermission(String) clashes with Context's int version
    removedMethods.add('com/aide/ui/MainActivity.checkSelfPermission(Ljava/lang/String;)Z')
    // classes replaced by the sources, e.g. com/aide/ui/build/android/AaptService$c
    def javaDir = file('src/main/java')
    excludedClasses.set(provider {
        fileTree(javaDir).matching { include '**/*.java' }.files.collect {
            def path = javaDir.toPath().relativize(it.toPath()).toString().replace(File.separatorChar, '/' as char)
            path.substring(0, path.length() - '.java'.length())
        }.sort()
    })
    outputDir = layout.buildDirectory.dir('fixed-api-jars')
}

android {
    namespace 'com.aide.ui.rewrite'
    compileSdk rootProject.compileSdk

    defaultConfig {
        minSdk rootProject.minSdk
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api project(':appAideBase')

    // Plain class jars
    implementation files(
            'libs/apksig-8.5.0-alpha07.jar',
            'libs/bcprov-jdk15on-1.70.jar',
            'libs/maven-model-3.9.1.jar',
            'libs/plexus-utils-3.5.1.jar',
            'libs/MTDataFilesProvider.jar')

    // Compile-time only; the jars that hold dex are added to the apk by :app_flavor
    compileOnly fileTree(fixedApiJars.flatMap { it.outputDir }) { builtBy fixedApiJars }
    compileOnly 'io.github.itsaky:nb-javac-android:17.0.0.3'

    api 'androidx.core:core:1.13.1'
    api 'androidx.preference:preference:1.2.1'
    api 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    api 'net.margaritov.preference.colorpicker.ColorPickerPreference:ColorPickerPreference:1.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
